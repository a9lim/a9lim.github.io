<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #EBEFF4;
    display: flex;
    align-items: center;
    font-family: system-ui;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 630px;
  }
  /* Fade-out on right edge */
  .flair::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, #EBEFF4);
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }
  .project-name {
    font-family: 'Noto Serif', serif;
    font-weight: 700;
    font-size: 156px;
    color: #0B1016;
    letter-spacing: -3px;
    line-height: 1;
  }
  .accent-line {
    width: 88px;
    height: 3px;
    background: #E11107;
    border-radius: 2px;
    margin-top: 28px;
  }
  .site-brand {
    font-family: 'Noto Sans Mono', monospace;
    font-size: 22px;
    color: #777C83;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .site-brand .copyleft {
    display: inline-block;
    transform: scaleX(-1);
    font-size: 17px;
    margin-right: 1px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="800" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Gerry</div>
    <div class="accent-line"></div>
    <div class="site-brand"><span class="copyleft">&copy;</span>a9l.im</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // District color map: 0=orange, 1=lime, 2=purple
    const DISTRICT_COLORS = [
      'rgba(196, 130, 37, 0.5)',   // orange #C48225
      'rgba(95, 171, 77, 0.5)',    // lime #5FAB4D
      'rgba(129, 96, 181, 0.5)',   // purple #8160B5
    ];

    // Zoomed-in grid — 4 columns x 5 rows, larger hexes
    // District map: 3 contiguous regions
    const colorMap = [
      [0,0,1,2],
      [0,0,1,2],
      [0,1,1,2],
      [0,1,2,2],
      [0,1,2,2],
    ];

    const COLS = 4;
    const ROWS = 5;
    const r = 90; // canvas-pixel radius (zoomed in)

    // Flat-top hex geometry
    const hexW = 2 * r;
    const hexH = Math.sqrt(3) * r;
    const colStep = 1.5 * r;
    const rowStep = Math.sqrt(3) * r;

    // Total grid extents
    const gridW = colStep * (COLS - 1) + hexW;
    const gridH = rowStep * ROWS + hexH / 2;

    // Center grid in canvas
    const originX = (W - gridW) / 2 + r;
    const originY = (H - gridH) / 2 + r;

    // Compute hex centers
    function hexCenter(col, row) {
      const cx = originX + col * colStep;
      const cy = originY + row * rowStep + (col % 2 === 1 ? rowStep / 2 : 0);
      return { cx, cy };
    }

    // Flat-top hex path — vertices at -30°, 30°, 90°, 150°, 210°, 270°
    // (same angle offset as the actual sim)
    function hexPath(cx, cy, rr) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6; // -30° start
        const x = cx + rr * Math.cos(angle);
        const y = cy + rr * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    // Get flat-top hex vertices with -30° start offset
    function hexVertices(cx, cy, rr) {
      const verts = [];
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6;
        verts.push({ x: cx + rr * Math.cos(angle), y: cy + rr * Math.sin(angle) });
      }
      return verts;
    }

    // Precompute all hex centers
    const hexes = [];
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const { cx, cy } = hexCenter(col, row);
        hexes.push({ col, row, cx, cy, district: colorMap[row][col] });
      }
    }

    // Neighbor distance threshold: center-to-center for adjacent flat-top hexes = sqrt(3)*r
    const neighborDist = rowStep * 1.05;

    // Find shared edge vertices between two adjacent hexes (distance-based)
    function sharedEdgeVertices(h1, h2) {
      const v1 = hexVertices(h1.cx, h1.cy, r);
      const v2 = hexVertices(h2.cx, h2.cy, r);
      const shared = [];
      for (const va of v1) {
        for (const vb of v2) {
          const dx = va.x - vb.x, dy = va.y - vb.y;
          if (dx*dx + dy*dy < 9) { // within 3px
            shared.push(va);
            break;
          }
        }
      }
      return shared;
    }

    // --- Draw hex fills ---
    for (const h of hexes) {
      hexPath(h.cx, h.cy, r);
      ctx.fillStyle = DISTRICT_COLORS[h.district];
      ctx.fill();
    }

    // --- Draw hex outlines (subtle, ~6% opacity) ---
    ctx.strokeStyle = 'rgba(11, 16, 22, 0.06)';
    ctx.lineWidth = 2;
    for (const h of hexes) {
      hexPath(h.cx, h.cy, r);
      ctx.stroke();
    }

    // --- Draw district boundaries (~30% opacity, thicker) ---
    ctx.strokeStyle = 'rgba(11, 16, 22, 0.3)';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';

    for (let i = 0; i < hexes.length; i++) {
      for (let j = i + 1; j < hexes.length; j++) {
        const h1 = hexes[i], h2 = hexes[j];
        if (h1.district === h2.district) continue;
        const dx = h1.cx - h2.cx, dy = h1.cy - h2.cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > neighborDist) continue;
        const sv = sharedEdgeVertices(h1, h2);
        if (sv.length === 2) {
          ctx.beginPath();
          ctx.moveTo(sv[0].x, sv[0].y);
          ctx.lineTo(sv[1].x, sv[1].y);
          ctx.stroke();
        }
      }
    }

    // --- Top fade ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 120);
    fadeTop.addColorStop(0, 'rgba(235, 239, 244, 1)');
    fadeTop.addColorStop(1, 'rgba(235, 239, 244, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 120);

    // --- Bottom fade ---
    const fadeBot = ctx.createLinearGradient(0, H - 160, 0, H);
    fadeBot.addColorStop(0, 'rgba(235, 239, 244, 0)');
    fadeBot.addColorStop(1, 'rgba(235, 239, 244, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 160, W, 160);
  </script>
</body>
</html>
