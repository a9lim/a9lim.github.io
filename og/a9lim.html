<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #EBEFF4;
    display: flex;
    align-items: center;
    font-family: system-ui;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 630px;
  }
  /* Fade-out on right edge */
  .flair::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, #EBEFF4);
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }
  .project-name {
    font-family: 'Noto Serif', serif;
    font-weight: 700;
    font-size: 156px;
    color: #0B1016;
    letter-spacing: -3px;
    line-height: 1;
  }
  .accent-line {
    width: 88px;
    height: 3px;
    background: #E11107;
    border-radius: 2px;
    margin-top: 28px;
  }
  .site-brand {
    font-family: 'Noto Sans Mono', monospace;
    font-size: 22px;
    color: #777C83;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .site-brand .copyleft {
    display: inline-block;
    transform: scaleX(-1);
    font-size: 17px;
    margin-right: 1px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="800" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">a9l.im</div>
    <div class="accent-line"></div>
    <div class="site-brand"><span class="copyleft">&copy;</span>a9l.im</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const img = new Image();
    img.onload = () => {
      const scale = 560 / img.naturalWidth;
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      const x = (W - w) / 2;
      const y = (H - h) / 2;
      ctx.drawImage(img, x, y, w, h);

      // Top fade
      const fadeTop = ctx.createLinearGradient(0, 0, 0, 60);
      fadeTop.addColorStop(0, 'rgba(235, 239, 244, 1)');
      fadeTop.addColorStop(1, 'rgba(235, 239, 244, 0)');
      ctx.fillStyle = fadeTop;
      ctx.fillRect(0, 0, W, 60);

      // Bottom fade
      const fadeBot = ctx.createLinearGradient(0, H - 100, 0, H);
      fadeBot.addColorStop(0, 'rgba(235, 239, 244, 0)');
      fadeBot.addColorStop(1, 'rgba(235, 239, 244, 1)');
      ctx.fillStyle = fadeBot;
      ctx.fillRect(0, H - 100, W, 100);

      window._ready = true;
    };
    img.src = '../logo.svg';
  </script>
</body>
</html>
