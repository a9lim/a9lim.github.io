<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #EBEFF4;
    display: flex;
    align-items: center;
    font-family: system-ui;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 630px;
  }
  /* Fade-out on right edge */
  .flair::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, #EBEFF4);
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }
  .project-name {
    font-family: 'Noto Serif', serif;
    font-weight: 700;
    font-size: 156px;
    color: #0B1016;
    letter-spacing: -3px;
    line-height: 1;
  }
  .accent-line {
    width: 88px;
    height: 3px;
    background: #E11107;
    border-radius: 2px;
    margin-top: 28px;
  }
  .site-brand {
    font-family: 'Noto Sans Mono', monospace;
    font-size: 22px;
    color: #777C83;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .site-brand .copyleft {
    display: inline-block;
    transform: scaleX(-1);
    font-size: 17px;
    margin-right: 1px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="800" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Geon</div>
    <div class="accent-line"></div>
    <div class="site-brand"><span class="copyleft">&copy;</span>a9l.im</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Colors matching physsim renderer.js
    const COLOR_SLATE   = '#767C85';
    const COLOR_POS     = '#C84341'; // positive charge → red
    const COLOR_NEG     = '#3590BF'; // negative charge → blue
    const COLOR_PHOTON  = '#B9A624'; // EM photon yellow
    const ALPHA_MAX     = 0.7;       // light mode trail alpha max
    const BG            = 'rgba(235, 239, 244, ';

    // Lerp two hex colors by t in [0,1] toward target, returning rgba string
    function lerpColor(base, target, t, a) {
      const pr = r => parseInt(r.slice(1,3),16);
      const pg = r => parseInt(r.slice(3,5),16);
      const pb = r => parseInt(r.slice(5,7),16);
      const ri = Math.round(pr(base) + (pr(target) - pr(base)) * t);
      const gi = Math.round(pg(base) + (pg(target) - pg(base)) * t);
      const bi = Math.round(pb(base) + (pb(target) - pb(base)) * t);
      return `rgba(${ri},${gi},${bi},${a})`;
    }

    // Evaluate a cubic bezier at t, returning {x,y}
    function bezier(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return {
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
      };
    }

    // Sample N+1 points along a cubic bezier curve
    function sampleBezier(p0, p1, p2, p3, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(bezier(p0, p1, p2, p3, i / n));
      return pts;
    }

    // Draw a trail from an array of points, alpha fading from 0 → alphaMax, color is hex
    function drawTrail(pts, color, lineWidth) {
      const n = pts.length - 1;
      ctx.lineCap = 'round';
      ctx.lineWidth = lineWidth;
      for (let i = 0; i < n; i++) {
        const alpha = ALPHA_MAX * (i / n);
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i+1].x, pts[i+1].y);
        ctx.strokeStyle = lerpColor(color, color, 0, alpha); // just the color at this alpha
        // rebuild rgba from hex each segment
        const r = parseInt(color.slice(1,3),16);
        const g = parseInt(color.slice(3,5),16);
        const b = parseInt(color.slice(5,7),16);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.stroke();
      }
    }

    // Draw a filled particle circle (flat fill, no gradient)
    function drawParticle(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // Draw a photon dot
    function drawPhoton(x, y, radius, alpha) {
      const r = parseInt(COLOR_PHOTON.slice(1,3),16);
      const g = parseInt(COLOR_PHOTON.slice(3,5),16);
      const b = parseInt(COLOR_PHOTON.slice(5,7),16);
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
    }

    // --- Particle definitions ---
    // Each has: current position (x,y), bezier control points for trail, charge color, radius
    const SEG = 20; // trail segments

    // Particle 1: positive (reddish), bottom-left region, curving up toward center
    const p1color = lerpColor(COLOR_SLATE, COLOR_POS, 0.8, 1).replace(/,1\)$/, ')').replace('rgba','rgb');
    // just use hex-like approach
    const P1_COLOR = '#B74746'; // slate toward red, ~80%
    const p1trail = sampleBezier(
      {x: 130, y: 1100},
      {x: 160, y: 880},
      {x: 280, y: 780},
      {x: 310, y: 670},
      SEG
    );

    // Particle 2: negative (bluish), top-right, curving down-left
    const P2_COLOR = '#4A85A8'; // slate toward blue ~70%
    const p2trail = sampleBezier(
      {x: 720, y: 180},
      {x: 680, y: 340},
      {x: 560, y: 460},
      {x: 490, y: 560},
      SEG
    );

    // Particle 3: positive, right edge mid, curving left in arc
    const P3_COLOR = '#A85050'; // slate toward red ~60%
    const p3trail = sampleBezier(
      {x: 760, y: 700},
      {x: 680, y: 680},
      {x: 580, y: 720},
      {x: 520, y: 810},
      SEG
    );

    // Particle 4: neutral (slate), upper-left, gentle curve downward
    const P4_COLOR = COLOR_SLATE;
    const p4trail = sampleBezier(
      {x:  80, y: 320},
      {x: 120, y: 430},
      {x: 200, y: 510},
      {x: 240, y: 590},
      SEG
    );

    // Particle 5: negative, lower-right, swooping arc
    const P5_COLOR = '#3F7EA0'; // slate toward blue ~75%
    const p5trail = sampleBezier(
      {x: 680, y: 1160},
      {x: 620, y: 1020},
      {x: 500, y: 940},
      {x: 430, y: 880},
      SEG
    );

    // Particle 6: positive, mid-left, short upward curve
    const P6_COLOR = '#C04544';
    const p6trail = sampleBezier(
      {x: 100, y: 780},
      {x: 130, y: 700},
      {x: 190, y: 660},
      {x: 230, y: 640},
      SEG
    );

    // Particle 7: neutral, upper-right region
    const P7_COLOR = COLOR_SLATE;
    const p7trail = sampleBezier(
      {x: 600, y: 300},
      {x: 570, y: 360},
      {x: 540, y: 400},
      {x: 520, y: 440},
      SEG
    );

    // --- Draw trails (behind particles) ---
    ctx.globalCompositeOperation = 'source-over';

    drawTrail(p1trail, P1_COLOR, 4);
    drawTrail(p2trail, P2_COLOR, 4);
    drawTrail(p3trail, P3_COLOR, 4);
    drawTrail(p4trail, P4_COLOR, 3);
    drawTrail(p5trail, P5_COLOR, 4);
    drawTrail(p6trail, P6_COLOR, 3);
    drawTrail(p7trail, P7_COLOR, 3);

    // --- Draw photons (tiny yellow dots scattered near interaction zones) ---
    const photons = [
      // near p1 trail midpoint area
      {x: 235, y: 760, r: 5, a: 0.45},
      {x: 200, y: 830, r: 4, a: 0.30},
      {x: 270, y: 720, r: 3, a: 0.20},
      // near p2 trail
      {x: 610, y: 390, r: 5, a: 0.40},
      {x: 640, y: 430, r: 3, a: 0.25},
      // near p3 trail
      {x: 600, y: 740, r: 4, a: 0.35},
      {x: 650, y: 770, r: 3, a: 0.20},
      // near p6
      {x: 170, y: 665, r: 4, a: 0.38},
      // scattered
      {x: 380, y: 500, r: 5, a: 0.28},
      {x: 420, y: 960, r: 4, a: 0.22},
      {x: 340, y: 420, r: 3, a: 0.18},
    ];
    photons.forEach(ph => drawPhoton(ph.x, ph.y, ph.r, ph.a));

    // --- Draw particles (flat fill circles, on top of trails) ---
    // Current position = last point of each trail
    const last = arr => arr[arr.length - 1];

    drawParticle(last(p1trail).x, last(p1trail).y, 18, P1_COLOR);
    drawParticle(last(p2trail).x, last(p2trail).y, 20, P2_COLOR);
    drawParticle(last(p3trail).x, last(p3trail).y, 16, P3_COLOR);
    drawParticle(last(p4trail).x, last(p4trail).y, 14, P4_COLOR);
    drawParticle(last(p5trail).x, last(p5trail).y, 18, P5_COLOR);
    drawParticle(last(p6trail).x, last(p6trail).y, 14, P6_COLOR);
    drawParticle(last(p7trail).x, last(p7trail).y, 12, P7_COLOR);

    // --- Top and bottom fades ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 120);
    fadeTop.addColorStop(0, 'rgba(235, 239, 244, 1)');
    fadeTop.addColorStop(1, 'rgba(235, 239, 244, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 120);

    const fadeBot = ctx.createLinearGradient(0, H - 160, 0, H);
    fadeBot.addColorStop(0, 'rgba(235, 239, 244, 0)');
    fadeBot.addColorStop(1, 'rgba(235, 239, 244, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 160, W, 160);
  </script>
</body>
</html>
