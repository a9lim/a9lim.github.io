<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Recursive:CASL,MONO,wght@0,0,300..700;0,1,300..700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F4F5F8;
    display: flex;
    align-items: center;
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 560px;
    height: 630px;
  }
  /* Soft fade-out that lets the spillover content show through */
  .flair::after {
    content: '';
    position: absolute;
    top: 0;
    left: 360px;
    width: 200px;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(244, 245, 248, 0.7));
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    position: relative;
    z-index: 1;
  }
  .project-name {
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0;
    font-weight: 700;
    font-size: 132px;
    color: #010203;
    letter-spacing: -3px;
    line-height: 1;
  }
  .site-brand {
    font-family: 'Recursive', monospace;
    font-variation-settings: 'MONO' 1, 'CASL' 0;
    font-size: 22px;
    color: #1E1F23;
    margin-top: 32px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="1120" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Miasma</div>
    <div class="site-brand">AGPL-3.0</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Right-align flair content within the canvas for visual symmetry
    // with the right-side text (native px units).
    const SHIFT_X = 120;
    ctx.save();
    ctx.translate(SHIFT_X, 0);

    // Hex grid params (flat-top hexes)
    const S = 48;                      // hex radius (center → vertex)
    const hexW = Math.sqrt(3) * S;     // horizontal width of a flat-top hex
    const hexH = 2 * S;                // vertical height
    const colStep = hexW;              // pointy-top horizontal step
    const rowStep = hexH * 0.75;       // pointy-top vertical step (overlap by 1/4)

    const HEX_STROKE = 'rgba(12, 13, 18, 0.12)';
    const HEX_FILL_S = 'rgba(12, 13, 18, 0.00)';     // susceptible: empty
    const HEX_FILL_I = 'rgba(225, 17, 7, 0.55)';     // infected: red accent
    const HEX_FILL_R = 'rgba(12, 13, 18, 0.18)';     // recovered: dark grey
    const DOT_COLOR  = 'rgba(225, 17, 7, 0.85)';

    // Pointy-top hex path centered at (cx, cy)
    function hexPath(cx, cy, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    // Seed deterministically — outbreak focus near upper-left of the grid.
    // Compartments roughly bloom outward in concentric rings.
    function compartmentAt(col, row) {
      const fx = 2, fy = 3;  // outbreak focus (in hex coords)
      const d = Math.abs(col - fx) + Math.abs(row - fy);
      // Distance-based wavefront: I in ring 1-3, R in ring 0-1, S otherwise
      if (d <= 1) return 'R';
      if (d <= 4) return 'I';
      return 'S';
    }

    ctx.lineWidth = 1.8;
    ctx.strokeStyle = HEX_STROKE;

    // Render hex grid
    const cols = 11;
    const rows = 13;
    for (let row = 0; row < rows; row++) {
      const xOff = (row % 2 === 0) ? 0 : hexW / 2;
      for (let col = 0; col < cols; col++) {
        const cx = col * colStep + xOff + hexW / 2;
        const cy = row * rowStep + hexH / 2;
        if (cx < -hexW || cx > 800 + hexW) continue;
        if (cy < -hexH || cy > H + hexH) continue;

        const state = compartmentAt(col, row);
        hexPath(cx, cy, S - 4);
        if (state === 'I') {
          ctx.fillStyle = HEX_FILL_I;
          ctx.fill();
        } else if (state === 'R') {
          ctx.fillStyle = HEX_FILL_R;
          ctx.fill();
        }
        ctx.stroke();

        // Drop a small infection dot at the center of infected cells
        if (state === 'I') {
          ctx.fillStyle = DOT_COLOR;
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    ctx.restore();

    // --- Top fade (full canvas width, drawn after restore) ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 160);
    fadeTop.addColorStop(0, 'rgba(244, 245, 248, 1)');
    fadeTop.addColorStop(1, 'rgba(244, 245, 248, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 160);

    // --- Bottom fade ---
    const fadeBot = ctx.createLinearGradient(0, H - 160, 0, H);
    fadeBot.addColorStop(0, 'rgba(244, 245, 248, 0)');
    fadeBot.addColorStop(1, 'rgba(244, 245, 248, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 160, W, 160);
  </script>
</body>
</html>
