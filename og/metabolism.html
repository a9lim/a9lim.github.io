<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #EBEFF4;
    display: flex;
    align-items: center;
    font-family: system-ui;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 630px;
  }
  /* Fade-out on right edge */
  .flair::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, #EBEFF4);
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }
  .project-name {
    font-family: 'Noto Serif', serif;
    font-weight: 700;
    font-size: 156px;
    color: #0B1016;
    letter-spacing: -3px;
    line-height: 1;
  }
  .accent-line {
    width: 88px;
    height: 3px;
    background: #E11107;
    border-radius: 2px;
    margin-top: 28px;
  }
  .site-brand {
    font-family: 'Noto Sans Mono', monospace;
    font-size: 22px;
    color: #777C83;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .site-brand .copyleft {
    display: inline-block;
    transform: scaleX(-1);
    font-size: 17px;
    margin-right: 1px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="800" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Cyano</div>
    <div class="accent-line"></div>
    <div class="site-brand"><span class="copyleft">&copy;</span>a9l.im</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Membrane curve: gentle convex-upward arc, center at H/2 = 630
    function membraneY(x) {
      const t = x / W;
      // Arc: rises from edges to center, displacement ~30px upward at center
      return H / 2 - 30 * Math.sin(Math.PI * t);
    }

    // Colors
    const HEAD_BLUE  = '#3590BF';
    const HEAD_GREEN = '#2CA470';
    const TAIL_COLOR = 'rgba(118, 124, 133, 0.4)';
    const CHANNEL_COLOR = 'rgba(129, 96, 181, 0.30)';
    const MOLECULE_COLOR = '#C48225';

    const HEAD_R  = 16;   // head radius px
    const TAIL_L  = 40;   // tail length px
    const GAP     = 100;  // hydrophobic interior gap (center to center of head rows)
    const N_LIPIDS = 20;  // lipids across width

    // Draw a single phospholipid
    // cx, cy: head center; tailDir: +1 = tail goes downward (upper leaflet), -1 = tail goes upward (lower leaflet)
    // colorIndex: 0=blue, 1=green
    function drawLipid(cx, cy, tailDir, colorIndex) {
      // Tail lines (two tails, slight angle outward)
      ctx.save();
      ctx.strokeStyle = TAIL_COLOR;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      // Left tail
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy + tailDir * HEAD_R * 0.6);
      ctx.lineTo(cx - 7, cy + tailDir * (HEAD_R * 0.6 + TAIL_L));
      ctx.stroke();

      // Right tail
      ctx.beginPath();
      ctx.moveTo(cx + 4, cy + tailDir * HEAD_R * 0.6);
      ctx.lineTo(cx + 7, cy + tailDir * (HEAD_R * 0.6 + TAIL_L));
      ctx.stroke();

      ctx.restore();

      // Head circle
      ctx.beginPath();
      ctx.arc(cx, cy, HEAD_R, 0, Math.PI * 2);
      ctx.fillStyle = colorIndex === 0 ? HEAD_BLUE : HEAD_GREEN;
      ctx.fill();
    }

    // --- Draw phospholipids ---
    const lipidSpacing = W / N_LIPIDS;
    const halfGap = GAP / 2;

    for (let i = 0; i < N_LIPIDS; i++) {
      const cx = lipidSpacing * i + lipidSpacing / 2;
      const mY = membraneY(cx);

      // Upper leaflet: head above membrane center, tails pointing inward (downward)
      const upperHeadY = mY - halfGap;
      drawLipid(cx, upperHeadY, +1, i % 2);

      // Lower leaflet: head below membrane center, tails pointing inward (upward)
      const lowerHeadY = mY + halfGap;
      drawLipid(cx, lowerHeadY, -1, (i + 1) % 2);
    }

    // --- Draw channel proteins ---
    // Each protein: two rounded rectangles (top half and bottom half) with a pore gap in center
    const channelXs = [250, 550, 700];
    const channelW  = 60;
    const poreGap   = 20;   // gap in center of channel
    const channelHalfH = halfGap - HEAD_R - 4; // height of each half (from membrane center to just inside head row)

    channelXs.forEach(cx => {
      const mY = membraneY(cx);
      const x = cx - channelW / 2;

      // Upper half of channel (above pore)
      const topOfUpper = mY - halfGap - 8;
      const heightUpper = halfGap - poreGap / 2 + 8;
      ctx.beginPath();
      ctx.roundRect(x, topOfUpper, channelW, heightUpper, 8);
      ctx.fillStyle = CHANNEL_COLOR;
      ctx.fill();

      // Lower half of channel (below pore)
      const topOfLower = mY + poreGap / 2;
      const heightLower = halfGap - poreGap / 2 + 8;
      ctx.beginPath();
      ctx.roundRect(x, topOfLower, channelW, heightLower, 8);
      ctx.fillStyle = CHANNEL_COLOR;
      ctx.fill();
    });

    // --- Draw small molecules (transport) ---
    // Positioned near/inside channel pores
    const molecules = [
      { x: 250,  yOff:  0  },
      { x: 250,  yOff: -28 },
      { x: 550,  yOff:  8  },
      { x: 700,  yOff: -6  },
    ];

    molecules.forEach(({ x, yOff }) => {
      const mY = membraneY(x);
      const cy = mY + yOff;
      ctx.beginPath();
      ctx.arc(x, cy, 8, 0, Math.PI * 2);
      ctx.fillStyle = MOLECULE_COLOR;
      ctx.fill();
    });

    // --- Top fade ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 60);
    fadeTop.addColorStop(0, 'rgba(235, 239, 244, 1)');
    fadeTop.addColorStop(1, 'rgba(235, 239, 244, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 60);

    // --- Bottom fade ---
    const fadeBot = ctx.createLinearGradient(0, H - 100, 0, H);
    fadeBot.addColorStop(0, 'rgba(235, 239, 244, 0)');
    fadeBot.addColorStop(1, 'rgba(235, 239, 244, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 100, W, 100);
  </script>
</body>
</html>
