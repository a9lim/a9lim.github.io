<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #EBEFF4;
    display: flex;
    align-items: center;
    font-family: system-ui;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 630px;
  }
  /* Fade-out on right edge */
  .flair::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, #EBEFF4);
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }
  .project-name {
    font-family: 'Noto Serif', serif;
    font-weight: 700;
    font-size: 156px;
    color: #0B1016;
    letter-spacing: -3px;
    line-height: 1;
  }
  .accent-line {
    width: 88px;
    height: 3px;
    background: #E11107;
    border-radius: 2px;
    margin-top: 28px;
  }
  .site-brand {
    font-family: 'Noto Sans Mono', monospace;
    font-size: 22px;
    color: #777C83;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .site-brand .copyleft {
    display: inline-block;
    transform: scaleX(-1);
    font-size: 17px;
    margin-right: 1px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="800" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Cyano</div>
    <div class="accent-line"></div>
    <div class="site-brand"><span class="copyleft">&copy;</span>a9l.im</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Scaled values (2x from sim's logical px)
    const headSpacing = 12;
    const headRadius  = 5;
    const memH        = 120;  // total membrane band height
    const memY        = H / 2 - memH / 2;  // top edge of membrane band
    const tailLen     = (memH - 6 - headRadius * 2) / 2;

    const HEAD_COLOR = 'rgba(78, 84, 92, 0.3)';
    const TAIL_COLOR = 'rgba(78, 84, 92, 0.15)';

    // Frozen time value for wobble
    const t = 1.5;

    // --- Upper heads and lower heads (batched fill) ---
    ctx.fillStyle = HEAD_COLOR;
    ctx.beginPath();
    for (let lx = 6; lx < W; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.05) * 2.4;

      // Upper head
      const topHeadY = memY + 3 + wobble;
      ctx.moveTo(lx + headRadius, topHeadY);
      ctx.arc(lx, topHeadY, headRadius, 0, Math.PI * 2);

      // Lower head (offset by half spacing)
      const botHeadY = memY + memH - 3 - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx + headRadius, botHeadY);
      ctx.arc(bx, botHeadY, headRadius, 0, Math.PI * 2);
    }
    ctx.fill();

    // --- Tail lines ---
    ctx.strokeStyle = TAIL_COLOR;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let lx = 6; lx < W; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.05) * 2.4;

      // Upper head tails (pointing inward = downward)
      const topHeadY = memY + 3 + wobble;
      ctx.moveTo(lx - 1,   topHeadY + headRadius);
      ctx.lineTo(lx - 1.5, topHeadY + headRadius + tailLen);
      ctx.moveTo(lx + 1,   topHeadY + headRadius);
      ctx.lineTo(lx + 1.5, topHeadY + headRadius + tailLen);

      // Lower head tails (pointing inward = upward)
      const botHeadY = memY + memH - 3 - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx - 1,   botHeadY - headRadius);
      ctx.lineTo(bx - 1.5, botHeadY - headRadius - tailLen);
      ctx.moveTo(bx + 1,   botHeadY - headRadius);
      ctx.lineTo(bx + 1.5, botHeadY - headRadius - tailLen);
    }
    ctx.stroke();

    // --- Top fade ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 120);
    fadeTop.addColorStop(0, 'rgba(235, 239, 244, 1)');
    fadeTop.addColorStop(1, 'rgba(235, 239, 244, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 120);

    // --- Bottom fade ---
    const fadeBot = ctx.createLinearGradient(0, H - 120, 0, H);
    fadeBot.addColorStop(0, 'rgba(235, 239, 244, 0)');
    fadeBot.addColorStop(1, 'rgba(235, 239, 244, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 120, W, 120);
  </script>
</body>
</html>
