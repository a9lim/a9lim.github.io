<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Recursive:CASL,MONO,wght@0,0,300..700;0,1,300..700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F4F5F8;
    display: flex;
    align-items: center;
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 560px;
    height: 630px;
  }
  /* Soft fade-out that lets the spillover content show through */
  .flair::after {
    content: '';
    position: absolute;
    top: 0;
    left: 360px;
    width: 200px;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(244, 245, 248, 0.7));
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    position: relative;
    z-index: 1;
  }
  .project-name {
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    font-weight: 700;
    font-size: 156px;
    color: #010203;
    letter-spacing: -3px;
    line-height: 1;
  }
  .site-brand {
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    font-size: 22px;
    color: #1E1F23;
    margin-top: 32px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="1120" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Geon</div>
    <div class="site-brand">AGPL-3.0</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Right-align flair content within the canvas for visual symmetry
    // with the right-side text (native px units).
    const SHIFT_X = 160;
    ctx.save();
    ctx.translate(SHIFT_X, 0);

    // Colors matching geon renderer.js
    const COLOR_SLATE   = '#808696';
    const COLOR_POS     = '#DA534F'; // positive charge → red
    const COLOR_NEG     = '#0091C9'; // negative charge → blue
    const COLOR_PHOTON  = '#998700'; // EM photon yellow
    const ALPHA_MAX     = 0.7;       // light mode trail alpha max
    const BG            = 'rgba(244, 245, 248, ';

    // Lerp two hex colors by t in [0,1] toward target, returning rgba string
    function lerpColor(base, target, t, a) {
      const pr = r => parseInt(r.slice(1,3),16);
      const pg = r => parseInt(r.slice(3,5),16);
      const pb = r => parseInt(r.slice(5,7),16);
      const ri = Math.round(pr(base) + (pr(target) - pr(base)) * t);
      const gi = Math.round(pg(base) + (pg(target) - pg(base)) * t);
      const bi = Math.round(pb(base) + (pb(target) - pb(base)) * t);
      return `rgba(${ri},${gi},${bi},${a})`;
    }

    // Evaluate a cubic bezier at t, returning {x,y}
    function bezier(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return {
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
      };
    }

    // Sample N+1 points along a cubic bezier curve
    function sampleBezier(p0, p1, p2, p3, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(bezier(p0, p1, p2, p3, i / n));
      return pts;
    }

    // Draw a trail matching geon renderer.js drawTrails():
    // 2-group batched strokes with midpoint alpha, default lineCap (butt),
    // lineWidth = 0.5 * particle radius
    function drawTrail(pts, color, particleRadius) {
      const n = pts.length - 1; // segment count
      const lineWidth = 0.5 * particleRadius;
      ctx.lineWidth = lineWidth;
      const r = parseInt(color.slice(1,3),16);
      const g = parseInt(color.slice(3,5),16);
      const b = parseInt(color.slice(5,7),16);
      const groupCount = 2;
      for (let g_ = 0; g_ < groupCount; g_++) {
        const segStart = Math.floor(g_ * n / groupCount);
        const segEnd = Math.floor((g_ + 1) * n / groupCount);
        if (segEnd <= segStart) continue;
        const midSeg = (segStart + segEnd) / 2;
        const alpha = ((midSeg + 1) / (n + 1)) * ALPHA_MAX;
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.moveTo(pts[segStart].x, pts[segStart].y);
        for (let s = segStart + 1; s <= segEnd; s++) {
          ctx.lineTo(pts[s].x, pts[s].y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;
    }

    // Draw a filled particle circle (flat fill, no gradient)
    function drawParticle(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // Draw a photon dot
    function drawPhoton(x, y, radius, alpha) {
      const r = parseInt(COLOR_PHOTON.slice(1,3),16);
      const g = parseInt(COLOR_PHOTON.slice(3,5),16);
      const b = parseInt(COLOR_PHOTON.slice(5,7),16);
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
    }

    // --- 3-body problem: 3 particles, very zoomed in ---
    const SEG = 25;

    // Particle 1: positive (reddish), sweeping from bottom-left
    const P1_COLOR = '#DA534F';
    const p1trail = sampleBezier(
      {x: -100, y: 1300},
      {x: 50, y: 850},
      {x: 300, y: 550},
      {x: 500, y: 350},
      SEG
    );

    // Particle 2: negative (bluish), sweeping from top-right
    const P2_COLOR = '#0091C9';
    const p2trail = sampleBezier(
      {x: 900, y: -50},
      {x: 650, y: 300},
      {x: 350, y: 650},
      {x: 150, y: 900},
      SEG
    );

    // Particle 3: neutral (slate), crossing through
    const P3_COLOR = COLOR_SLATE;
    const p3trail = sampleBezier(
      {x: -50, y: 400},
      {x: 250, y: 500},
      {x: 500, y: 700},
      {x: 700, y: 1100},
      SEG
    );

    // --- Draw trails (lineWidth = 0.5 * radius, matching renderer.js) ---
    ctx.globalCompositeOperation = 'source-over';
    drawTrail(p1trail, P1_COLOR, 65);   // radius 65 → lineWidth 32.5
    drawTrail(p2trail, P2_COLOR, 70);   // radius 70 → lineWidth 35
    drawTrail(p3trail, P3_COLOR, 55);   // radius 55 → lineWidth 27.5

    // --- Photons near interaction zone ---
    const photons = [
      {x: 380, y: 550, r: 14, a: 0.45},
      {x: 300, y: 650, r: 11, a: 0.35},
      {x: 480, y: 480, r: 10, a: 0.30},
      {x: 250, y: 720, r: 12, a: 0.25},
      {x: 500, y: 600, r: 9, a: 0.20},
    ];
    photons.forEach(ph => drawPhoton(ph.x, ph.y, ph.r, ph.a));

    // --- Draw particles (large, flat fill) ---
    const last = arr => arr[arr.length - 1];
    drawParticle(last(p1trail).x, last(p1trail).y, 65, P1_COLOR);
    drawParticle(last(p2trail).x, last(p2trail).y, 70, P2_COLOR);
    drawParticle(last(p3trail).x, last(p3trail).y, 55, P3_COLOR);

    ctx.restore();

    // --- Top and bottom fades (full canvas width, drawn after restore) ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 120);
    fadeTop.addColorStop(0, 'rgba(244, 245, 248, 1)');
    fadeTop.addColorStop(1, 'rgba(244, 245, 248, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 120);

    const fadeBot = ctx.createLinearGradient(0, H - 160, 0, H);
    fadeBot.addColorStop(0, 'rgba(244, 245, 248, 0)');
    fadeBot.addColorStop(1, 'rgba(244, 245, 248, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 160, W, 160);
  </script>
</body>
</html>
