<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Recursive:CASL,MONO,wght@0,0,300..700;0,1,300..700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F4F5F8;
    display: flex;
    align-items: center;
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    position: relative;
  }
  .flair {
    width: 400px;
    height: 630px;
    flex-shrink: 0;
    position: relative;
  }
  .flair canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 560px;
    height: 630px;
  }
  /* Soft fade-out that lets the spillover content show through */
  .flair::after {
    content: '';
    position: absolute;
    top: 0;
    left: 360px;
    width: 200px;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(244, 245, 248, 0.7));
    pointer-events: none;
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    position: relative;
    z-index: 1;
  }
  .project-name {
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    font-weight: 700;
    font-size: 156px;
    color: #010203;
    letter-spacing: -3px;
    line-height: 1;
  }
  .site-brand {
    font-family: 'Recursive', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.5;
    font-size: 22px;
    color: #1E1F23;
    margin-top: 32px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="flair">
    <canvas id="flair" width="1120" height="1260"></canvas>
  </div>
  <div class="text-side">
    <div class="project-name">Cyano</div>
    <div class="site-brand">AGPL-3.0</div>
  </div>

  <script>
    const canvas = document.getElementById('flair');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Right-align flair content within the canvas for visual symmetry
    // with the right-side text (native px units).
    const SHIFT_X = 160;
    ctx.save();
    ctx.translate(SHIFT_X, 0);

    // Zoomed in ~8x from sim's logical pixels
    const S = 8;
    const headSpacing = 6 * S;
    const headRadius  = 2.5 * S;
    const memH        = 60 * S;  // total membrane band height
    const memY        = H / 2 - memH / 2;
    const tailLen     = (memH - 6 * S - headRadius * 2) / 2;

    const HEAD_COLOR = 'rgba(12, 13, 18, 0.3)';
    const TAIL_COLOR = 'rgba(12, 13, 18, 0.15)';

    const t = 1.5;

    // --- Upper heads and lower heads (batched fill) ---
    ctx.fillStyle = HEAD_COLOR;
    ctx.beginPath();
    for (let lx = 6 * S; lx < 800; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.01) * 1.2 * S;

      const topHeadY = memY + 3 * S + wobble;
      ctx.moveTo(lx + headRadius, topHeadY);
      ctx.arc(lx, topHeadY, headRadius, 0, Math.PI * 2);

      const botHeadY = memY + memH - 3 * S - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx + headRadius, botHeadY);
      ctx.arc(bx, botHeadY, headRadius, 0, Math.PI * 2);
    }
    ctx.fill();

    // --- Tail lines ---
    ctx.strokeStyle = TAIL_COLOR;
    ctx.lineWidth = 0.7 * S;
    ctx.beginPath();
    for (let lx = 6 * S; lx < 800; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.01) * 1.2 * S;

      const topHeadY = memY + 3 * S + wobble;
      ctx.moveTo(lx - 1 * S,   topHeadY + headRadius);
      ctx.lineTo(lx - 1.5 * S, topHeadY + headRadius + tailLen);
      ctx.moveTo(lx + 1 * S,   topHeadY + headRadius);
      ctx.lineTo(lx + 1.5 * S, topHeadY + headRadius + tailLen);

      const botHeadY = memY + memH - 3 * S - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx - 1 * S,   botHeadY - headRadius);
      ctx.lineTo(bx - 1.5 * S, botHeadY - headRadius - tailLen);
      ctx.moveTo(bx + 1 * S,   botHeadY - headRadius);
      ctx.lineTo(bx + 1.5 * S, botHeadY - headRadius - tailLen);
    }
    ctx.stroke();

    ctx.restore();

    // --- Top fade (full canvas width, drawn after restore) ---
    const fadeTop = ctx.createLinearGradient(0, 0, 0, 160);
    fadeTop.addColorStop(0, 'rgba(244, 245, 248, 1)');
    fadeTop.addColorStop(1, 'rgba(244, 245, 248, 0)');
    ctx.fillStyle = fadeTop;
    ctx.fillRect(0, 0, W, 160);

    // --- Bottom fade ---
    const fadeBot = ctx.createLinearGradient(0, H - 160, 0, H);
    fadeBot.addColorStop(0, 'rgba(244, 245, 248, 0)');
    fadeBot.addColorStop(1, 'rgba(244, 245, 248, 1)');
    ctx.fillStyle = fadeBot;
    ctx.fillRect(0, H - 160, W, 160);
  </script>
</body>
</html>
