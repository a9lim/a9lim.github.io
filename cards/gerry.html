<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px;
    height: 600px;
    overflow: hidden;
    background: #E6E8ED;
  }
  canvas { display: block; width: 960px; height: 600px; }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1200"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // District colors — same 3 as gerry sim
    const DISTRICT_COLORS = [
      'rgba(202, 104, 0, 0.45)',
      'rgba(68, 157, 46, 0.45)',
      'rgba(151, 105, 220, 0.45)',
    ];

    // Seeded PRNG for deterministic layout
    let seed = 19;
    function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

    // Pointy-top hex grid filling the card
    const r = 90;
    const colStep = Math.sqrt(3) * r;
    const rowStep = 1.5 * r;

    const COLS = Math.ceil(W / colStep) + 2;
    const ROWS = Math.ceil(H / rowStep) + 2;

    const originX = -colStep / 2;
    const originY = -r;

    function hexCenter(col, row) {
      return {
        cx: originX + col * colStep + (row % 2 === 1 ? colStep / 2 : 0),
        cy: originY + row * rowStep,
      };
    }

    function hexPath(cx, cy, rr) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6;
        const x = cx + rr * Math.cos(angle);
        const y = cy + rr * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    function hexVertices(cx, cy, rr) {
      const verts = [];
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6;
        verts.push({ x: cx + rr * Math.cos(angle), y: cy + rr * Math.sin(angle) });
      }
      return verts;
    }

    // Build hex grid with district assignments
    // Use spatial regions to create organic-looking districts
    const hexes = [];
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const { cx, cy } = hexCenter(col, row);
        // Assign district based on diagonal bands + noise for organic look
        const diag = (cx / W + cy / H) * 3 + (rand() - 0.5) * 0.8;
        const district = diag < 1.2 ? 0 : diag < 2.2 ? 1 : 2;
        hexes.push({ col, row, cx, cy, district });
      }
    }

    // Draw hex fills
    for (const h of hexes) {
      hexPath(h.cx, h.cy, r);
      ctx.fillStyle = DISTRICT_COLORS[h.district];
      ctx.fill();
    }

    // Draw all hex outlines
    ctx.strokeStyle = 'rgba(9, 11, 15, 0.05)';
    ctx.lineWidth = 2;
    for (const h of hexes) {
      hexPath(h.cx, h.cy, r);
      ctx.stroke();
    }

    // Draw district boundaries
    ctx.strokeStyle = 'rgba(9, 11, 15, 0.25)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';

    const neighborDist = colStep * 1.05;
    for (let i = 0; i < hexes.length; i++) {
      for (let j = i + 1; j < hexes.length; j++) {
        const h1 = hexes[i], h2 = hexes[j];
        if (h1.district === h2.district) continue;
        const dx = h1.cx - h2.cx, dy = h1.cy - h2.cy;
        if (Math.sqrt(dx*dx + dy*dy) > neighborDist) continue;

        const v1 = hexVertices(h1.cx, h1.cy, r);
        const v2 = hexVertices(h2.cx, h2.cy, r);
        const shared = [];
        for (const va of v1) {
          for (const vb of v2) {
            const ddx = va.x - vb.x, ddy = va.y - vb.y;
            if (ddx*ddx + ddy*ddy < 25) { shared.push(va); break; }
          }
        }
        if (shared.length === 2) {
          ctx.beginPath();
          ctx.moveTo(shared[0].x, shared[0].y);
          ctx.lineTo(shared[1].x, shared[1].y);
          ctx.stroke();
        }
      }
    }
  </script>
</body>
</html>
