<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px;
    height: 600px;
    overflow: hidden;
    background: #EBEFF4;
  }
  canvas { display: block; width: 960px; height: 600px; }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1200"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Lipid bilayer filling the card — same physics as OG card but wider
    const S = 8;
    const headSpacing = 6 * S;
    const headRadius  = 2.5 * S;
    const memH        = 60 * S;
    const memY        = H / 2 - memH / 2;
    const tailLen     = (memH - 6 * S - headRadius * 2) / 2;

    const HEAD_COLOR = 'rgba(78, 84, 92, 0.25)';
    const TAIL_COLOR = 'rgba(78, 84, 92, 0.12)';

    const t = 1.5;

    // Upper and lower phospholipid heads
    ctx.fillStyle = HEAD_COLOR;
    ctx.beginPath();
    for (let lx = 3 * S; lx < W + headSpacing; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.008) * 1.2 * S;

      const topHeadY = memY + 3 * S + wobble;
      ctx.moveTo(lx + headRadius, topHeadY);
      ctx.arc(lx, topHeadY, headRadius, 0, Math.PI * 2);

      const botHeadY = memY + memH - 3 * S - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx + headRadius, botHeadY);
      ctx.arc(bx, botHeadY, headRadius, 0, Math.PI * 2);
    }
    ctx.fill();

    // Tail lines
    ctx.strokeStyle = TAIL_COLOR;
    ctx.lineWidth = 0.7 * S;
    ctx.beginPath();
    for (let lx = 3 * S; lx < W + headSpacing; lx += headSpacing) {
      const wobble = Math.sin(t * 2 + lx * 0.008) * 1.2 * S;

      const topHeadY = memY + 3 * S + wobble;
      ctx.moveTo(lx - 1 * S,   topHeadY + headRadius);
      ctx.lineTo(lx - 1.5 * S, topHeadY + headRadius + tailLen);
      ctx.moveTo(lx + 1 * S,   topHeadY + headRadius);
      ctx.lineTo(lx + 1.5 * S, topHeadY + headRadius + tailLen);

      const botHeadY = memY + memH - 3 * S - wobble;
      const bx = lx + headSpacing / 2;
      ctx.moveTo(bx - 1 * S,   botHeadY - headRadius);
      ctx.lineTo(bx - 1.5 * S, botHeadY - headRadius - tailLen);
      ctx.moveTo(bx + 1 * S,   botHeadY - headRadius);
      ctx.lineTo(bx + 1.5 * S, botHeadY - headRadius - tailLen);
    }
    ctx.stroke();

    // Scatter some molecule-like dots outside the membrane
    const MOLECULE_COLORS = [
      'rgba(200, 83, 61, 0.18)',  // reddish — ATP
      'rgba(53, 144, 191, 0.15)', // blue — NADH
      'rgba(185, 166, 36, 0.14)', // yellow — photon
      'rgba(95, 171, 77, 0.16)',  // green — CO2
    ];
    let seed = 7;
    function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

    for (let i = 0; i < 35; i++) {
      const x = rand() * W;
      const zone = rand() > 0.5 ? 0 : 1; // above or below membrane
      const y = zone === 0
        ? rand() * (memY - 40)
        : memY + memH + 40 + rand() * (H - memY - memH - 80);
      const r = 6 + rand() * 14;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = MOLECULE_COLORS[Math.floor(rand() * MOLECULE_COLORS.length)];
      ctx.fill();
    }
  </script>
</body>
</html>
