<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px;
    height: 600px;
    overflow: hidden;
    background: #EBEFF4;
  }
  canvas { display: block; width: 960px; height: 600px; }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1200"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Particle colors from geon renderer
    const P1_COLOR = '#B74746';
    const P2_COLOR = '#4A85A8';
    const P3_COLOR = '#767C85';
    const P4_COLOR = '#8B6D45';
    const PHOTON   = '#B9A624';

    function bezier(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return {
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
      };
    }

    function sampleBezier(p0, p1, p2, p3, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(bezier(p0, p1, p2, p3, i / n));
      return pts;
    }

    function drawTrail(pts, color, radius) {
      const n = pts.length - 1;
      const lw = 0.5 * radius;
      ctx.lineWidth = lw;
      ctx.lineCap = 'butt';
      const r = parseInt(color.slice(1,3),16);
      const g = parseInt(color.slice(3,5),16);
      const b = parseInt(color.slice(5,7),16);
      for (let grp = 0; grp < 3; grp++) {
        const s0 = Math.floor(grp * n / 3);
        const s1 = Math.floor((grp + 1) * n / 3);
        if (s1 <= s0) continue;
        const mid = (s0 + s1) / 2;
        ctx.globalAlpha = ((mid + 1) / (n + 1)) * 0.65;
        ctx.strokeStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.moveTo(pts[s0].x, pts[s0].y);
        for (let s = s0 + 1; s <= s1; s++) ctx.lineTo(pts[s].x, pts[s].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawParticle(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawPhoton(x, y, r, a) {
      const cr = parseInt(PHOTON.slice(1,3),16);
      const cg = parseInt(PHOTON.slice(3,5),16);
      const cb = parseInt(PHOTON.slice(5,7),16);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
      ctx.fill();
    }

    const SEG = 30;

    // 4-body orbital scene spread across the full card
    const t1 = sampleBezier(
      {x: -80, y: 1100}, {x: 250, y: 700}, {x: 700, y: 400}, {x: 1100, y: 200}, SEG
    );
    const t2 = sampleBezier(
      {x: 2000, y: 100}, {x: 1500, y: 400}, {x: 1000, y: 700}, {x: 600, y: 950}, SEG
    );
    const t3 = sampleBezier(
      {x: -50, y: 300}, {x: 500, y: 500}, {x: 1100, y: 600}, {x: 1700, y: 900}, SEG
    );
    const t4 = sampleBezier(
      {x: 1900, y: 1200}, {x: 1400, y: 800}, {x: 800, y: 350}, {x: 300, y: 50}, SEG
    );

    drawTrail(t1, P1_COLOR, 80);
    drawTrail(t2, P2_COLOR, 90);
    drawTrail(t3, P3_COLOR, 60);
    drawTrail(t4, P4_COLOR, 55);

    // Photons near interaction zones
    const photons = [
      {x: 750, y: 500, r: 18, a: 0.4},
      {x: 850, y: 580, r: 14, a: 0.35},
      {x: 680, y: 620, r: 12, a: 0.3},
      {x: 950, y: 450, r: 16, a: 0.25},
      {x: 600, y: 400, r: 10, a: 0.2},
      {x: 1100, y: 550, r: 13, a: 0.25},
      {x: 500, y: 700, r: 11, a: 0.2},
    ];
    photons.forEach(p => drawPhoton(p.x, p.y, p.r, p.a));

    // Particles at trail ends
    const last = arr => arr[arr.length - 1];
    drawParticle(last(t1).x, last(t1).y, 80, P1_COLOR);
    drawParticle(last(t2).x, last(t2).y, 90, P2_COLOR);
    drawParticle(last(t3).x, last(t3).y, 60, P3_COLOR);
    drawParticle(last(t4).x, last(t4).y, 55, P4_COLOR);
  </script>
</body>
</html>
