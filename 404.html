<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — a9l.im</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700&family=Recursive:wght@400&display=swap" rel="stylesheet">

    <script src="shared-tokens.js"></script>
    <link rel="stylesheet" href="shared-base.css">
    <link rel="icon" href="favicon.ico">

    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            color: var(--text);
            font-family: var(--font-body);
            text-align: center;
        }
        .error-page {
            max-width: 480px;
            padding: 32px 24px;
        }
        .error-code {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(5rem, 15vw, 9rem);
            line-height: 1;
            color: var(--text-muted);
            letter-spacing: -3px;
        }
        .accent-line {
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: 20px auto;
        }
        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .home-link {
            display: inline-block;
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 500;
            color: #FDFBF5;
            text-decoration: none;
            padding: 0.8rem 2.8rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: var(--radius-pill);
            letter-spacing: 0.02em;
            transition: all 0.35s var(--ease-out);
            position: relative;
            overflow: hidden;
        }
        .home-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s var(--ease-out);
        }
        .home-link:hover::before {
            left: 100%;
        }
        .home-link:hover {
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: #FDFBF5;
        }
        .home-link:active {
            transform: translateY(0) scale(0.98);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="accent-line"></div>
        <p class="error-message">This page doesn't exist. It may have been moved or removed.</p>
        <a href="/" class="home-link">Back to a9l.im</a>
    </div>

    <script>
        // Respect saved theme preference
        const saved = localStorage.getItem('a9lim-theme')
            || localStorage.getItem('geon-theme')
            || localStorage.getItem('shoals-theme');
        if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
    </script>
</body>
</html>
