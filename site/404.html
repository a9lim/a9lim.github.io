<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | a9l.im</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="/fonts/fonts.css">

    <script src="/shared/tokens.js"></script>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="icon" href="favicon.ico">

    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            color: var(--text);
            font-family: var(--font-mono);
            font-variation-settings: var(--fvs-mono);
            text-align: center;
        }
        .error-page {
            max-width: 480px;
            padding: 32px 24px;
        }
        .error-code {
            font-family: var(--font-display);
            font-variation-settings: var(--fvs-prose);
            font-weight: 700;
            font-size: clamp(5rem, 15vw, 9rem);
            line-height: 1;
            color: var(--text-muted);
            letter-spacing: -3px;
        }
        .accent-line {
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 0;
            margin: 20px auto;
        }
        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .home-link {
            display: inline-block;
            font-family: var(--font-mono);
            font-variation-settings: var(--fvs-mono);
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-on-accent);
            text-decoration: none;
            padding: 0.8rem 2.8rem;
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: background 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
        }
        .home-link:hover {
            background: var(--accent-light);
            box-shadow: var(--shadow-glow);
        }
        .home-link:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="accent-line"></div>
        <p class="error-message">This page doesn't exist. It may have been moved or removed.</p>
        <a href="/" class="home-link">Back to a9l.im</a>
    </div>

    <script>
        // Respect saved theme preference
        const saved = localStorage.getItem('a9lim-theme')
            || localStorage.getItem('geon-theme')
            || localStorage.getItem('shoals-theme');
        if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
    </script>
</body>
</html>
